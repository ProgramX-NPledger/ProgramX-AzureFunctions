# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy dotnet core app to Azure Function App - fa-programx

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'ProgramX.Azure.FunctionApp' # set this to the path to your web app project, defaults to the repository root
  DOTNET_VERSION: '9.0.x' # set this to the dotnet version to use
  GIT_COMMIT_SHA: ${{ github.sha }}
  BUILD_NUMBER: ${{ github.run_number }}
  DEPLOYED_AT: ${{ github.event.head_commit.timestamp }}

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: 'Checkout GitHub Action' 
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 'Build'
        working-directory: ./ProgramX.Azure.FunctionApp
        shell: pwsh
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          dotnet build --configuration Release --output ./output
          popd

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B11CEB1F20914D5C8ED4FEE74AD8E500 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9B99F2F4C48C4990BBBA16E1419B4DE6 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_A7F0747C32CF4301979B23E995724383 }}

      # Both slots must be stamped. Without --slot, `az functionapp config appsettings set`
      # writes to production only, which left staging reporting stale Commit__* values from
      # GET api/v1/build - and, while the deploy was misrouted, left production reporting the
      # newest commit hash while still running old code.
      - name: Set Azure Function App environment variables
        shell: pwsh
        run: |
          $settings = @(
            "Commit__CommitHash=${{ github.sha }}"
            "Commit__BuildNumber=${{ github.run_number }}"
            "Commit__DeployedAt=$env:DEPLOYED_AT"
          )

          # production is addressed by omitting --slot; 'production' is not a real slot name.
          az functionapp config appsettings set `
            --name "${{ secrets.AZURE_FUNCTIONAPP_NAME }}" `
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            --settings $settings
          if ($LASTEXITCODE -ne 0) { throw "Failed to set app settings on production" }

          az functionapp config appsettings set `
            --name "${{ secrets.AZURE_FUNCTIONAPP_NAME }}" `
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" `
            --slot staging `
            --settings $settings
          if ($LASTEXITCODE -ne 0) { throw "Failed to set app settings on staging" }

      # Deliberately NO publish-profile on either step. A publish profile is slot-specific and
      # embeds its own SCM publishUrl, which is what actually routes the package - so passing the
      # staging profile to both steps sent both deploys to staging and production never received
      # code at all. Relying on the azure/login@v2 OIDC session above makes slot-name authoritative.
      - name: 'Deploy Azure Functions App to Staging'
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'fa-programx'
          slot-name: 'staging'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/ProgramX.Azure.FunctionApp/output'

      # slot-name is omitted entirely to target production; 'production' is not a real slot name.
      - name: 'Deploy Azure Functions App to Production'
        uses: Azure/functions-action@v1
        id: faenv
        with:
          app-name: 'fa-programx'
          package: '${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/ProgramX.Azure.FunctionApp/output'

  
          












